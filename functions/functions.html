    <script>
        function checkNum(){
            var userNum = prompt ("Please type a whole number!", "");
        
            if(userNum < 10) {
                console.log(`You entered a number smaller than 10!`);
                for(var i=0; i<10; i++) {
                    console.log(`Here is a ${i}`);
            }
            } else if(userNum > 9){
                console.log(`You entered a big number!`);
            } else {
                console.log(`ERROR: you didn't enter a number!`);
            }
            var myString = "here is a message";
            var upperString = myString.toUpperCase();
            console.log (myString);
            console.log (upperString);
        } 

        function upperMessage(message){

        function addNums(num1, num2){
            var sum = num1 + num2;
            console.log(sum)
        }

        /* addNums (3,5); */

        function addNums2(num1, num2){
            var sum = num1 + num2;
            return sum;
        }
        
        /* console.log( addNums2 (4,8) ); */
        
        function randomInt (min,max){
            var numOfValues = max - min + 1;
            var randomNum = Math.random();
            var randomVal = randomNum * numOfValues;
            var roundedRandomVal = Math.floor(randomVal);
            var finalNum = min + roundedRandomVal;

            return finalNum;
        }

        /* console.log(randomInt (1,20)); */

        var myRandomNum = randomInt (1,20);
        console.log (myRandomNum);
