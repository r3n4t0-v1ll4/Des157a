<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 1</title>
</head>
<body>
    <h1>Experiment 1</h1>
    <h2>Write a program that capitalizes every other letter (even or odd letters) in words in the string</h2>
    <script>
        /* my program capitalizes every other letter in the words in the string */
        /* Sequence: */
        var sentence = "the orange orange turned brown as time went on";
        var newSentence = "";
        var capitalize = true;
            /* Loop: */
        for (var i=0; i < sentence.length; i++){
            if (sentence[i] === " ") {
                newSentence += " ";
            } else if (capitalize) {
                newSentence += sentence[i].toUpperCase();
                capitalize = false;
            } else {
               newSentence += sentence[i].toLowerCase();
               capitalize = true; 
            }
        }
        console.log(newSentence);
    </script>
</body>
</html>
